version: 0.0.31
repository: https://github.com/viamrobotics/viam_flutter_hotspot_provisioning_widget
homepage: https://www.viam.com/

environment:
  sdk: ">=3.6.1 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_wifi_connect: ^2.0.1
